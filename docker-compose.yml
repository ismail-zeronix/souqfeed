services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: souqfeed
      POSTGRES_PASSWORD: souqfeed
      POSTGRES_DB: souqfeed
    ports:
      - "5432:5432"
    volumes:
      - souqfeed_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -h forces a real TCP check on 5432; pg_isready with no host connects
      # over the local socket, which the initdb bootstrap server also
      # answers on during first-run cold start, reporting healthy before
      # the real server is accepting connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U souqfeed -d souqfeed"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - souqfeed_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  souqfeed_postgres_data:
  souqfeed_redis_data:
