<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 217 234" role="img" aria-label="SouqFeed">
<defs>
<linearGradient id="mascotPurple" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#8A62FF"/>
  <stop offset="0.52" stop-color="#6C42F5"/>
  <stop offset="1" stop-color="#5630E8"/>
</linearGradient>
<linearGradient id="feedPurple" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#8157FF"/>
  <stop offset="1" stop-color="#5A31EE"/>
</linearGradient>
</defs>
<style>
#agent { transform-origin: center; animation: sf-float 2.8s ease-in-out infinite; }
#eye-1,#eye-2 { transform-box: fill-box; transform-origin:center; animation: sf-blink 4.4s ease-in-out infinite; }
#signal-1 { transform-box: fill-box; transform-origin:center; animation: sf-signal 1.6s ease-in-out infinite; }
#signal-2 { transform-box: fill-box; transform-origin:center; animation: sf-signal 1.6s .18s ease-in-out infinite; }
@keyframes sf-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
@keyframes sf-blink { 0%,43%,47%,100%{transform:scaleY(1)} 45%{transform:scaleY(.12)} }
@keyframes sf-signal { 0%,100%{opacity:.45;transform:translateY(0)} 50%{opacity:1;transform:translateY(-2px)} }
@media(prefers-reduced-motion:reduce){#agent,#eye-1,#eye-2,#signal-1,#signal-2{animation:none!important}}
</style>

<g id="agent" transform="translate(-24 -16)">
  <path id="body" d="M 156 68 L 137 63 L 118 63 L 104 66 L 96 69 L 83 76 L 75 82 L 66 91 L 60 99 L 52 114 L 49 122 L 45 139 L 43 154 L 43 165 L 40 171 L 34 179 L 31 186 L 30 193 L 31 201 L 36 211 L 43 217 L 51 220 L 61 219 L 66 220 L 68 228 L 72 234 L 80 240 L 91 243 L 100 243 L 109 241 L 121 235 L 133 225 L 145 224 L 158 220 L 168 215 L 175 210 L 188 196 L 195 183 L 200 167 L 202 151 L 201 131 L 199 121 L 195 109 L 189 97 L 179 84 L 170 76 Z M 179 104 L 184 111 L 189 123 L 191 132 L 191 144 L 187 156 L 184 160 L 176 167 L 170 170 L 153 175 L 127 178 L 126 177 L 116 176 L 106 172 L 96 163 L 92 157 L 88 144 L 88 131 L 89 127 L 95 115 L 105 106 L 112 102 L 126 97 L 149 93 L 157 93 L 166 95 L 172 98 Z" fill="url(#mascotPurple)" fill-rule="evenodd"/>
  <path id="signal-1" d="M 189 22 L 181 22 L 177 25 L 175 29 L 169 48 L 169 55 L 173 60 L 176 61 L 182 61 L 187 57 L 196 35 L 196 29 L 195 27 Z" fill="url(#mascotPurple)" fill-rule="evenodd"/><path id="signal-2" d="M 228 45 L 226 44 L 219 44 L 214 47 L 196 65 L 194 70 L 194 73 L 195 76 L 199 80 L 201 81 L 207 81 L 211 79 L 232 61 L 233 59 L 233 51 Z" fill="url(#mascotPurple)" fill-rule="evenodd"/>
  <path id="face" d="M 181 108 L 170 98 L 163 95 L 157 94 L 141 95 L 131 97 L 117 101 L 102 109 L 94 118 L 91 124 L 89 132 L 89 144 L 90 149 L 95 160 L 102 168 L 108 172 L 120 176 L 141 176 L 161 172 L 174 167 L 183 160 L 187 154 L 190 144 L 190 132 L 186 117 Z M 129 121 L 133 121 L 135 122 L 139 127 L 142 140 L 142 148 L 137 153 L 133 153 L 131 152 L 127 147 L 123 130 L 123 127 L 124 125 Z M 159 115 L 166 115 L 170 119 L 174 135 L 174 140 L 170 145 L 166 146 L 162 144 L 160 142 L 155 124 L 155 120 Z" fill="#FCFBFF" fill-rule="evenodd"/>
