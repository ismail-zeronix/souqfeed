services:
  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env}
    container_name: souqfeed-app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    networks:
      - proxy-net
      - souqfeed-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: souqfeed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - souqfeed_postgres_prod_data:/var/lib/postgresql/data
    networks:
      - souqfeed-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: souqfeed-redis
    restart: unless-stopped
    volumes:
      - souqfeed_redis_prod_data:/data
    networks:
      - souqfeed-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-off migration runner. Gated behind the "tools" profile so it
  # never starts via `docker compose up` — invoke explicitly with:
  #   docker compose --profile tools run --rm migrate
  migrate:
    build:
      context: .
      target: migrator
    container_name: souqfeed-migrate
    env_file:
      - .env
    networks:
      - souqfeed-net
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]
    restart: "no"

networks:
  proxy-net:
    external: true
  souqfeed-net:
    driver: bridge

volumes:
  souqfeed_postgres_prod_data:
  souqfeed_redis_prod_data:
